<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trinetra Systems</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a 60%, #020617 100%);
    }

    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 640px;
      margin: 1rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.72);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      letter-spacing: 0.04em;
    }

    p {
      margin: 1rem 0 0;
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      color: #cbd5e1;
    }

    .accent {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Trinetra <span class="accent">Systems</span></h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
