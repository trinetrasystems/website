<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trinetra Systems — GST Invoice Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#181D42;
    --ink-2:#262E63;
    --accent:#5062DE;
    --accent-deep:#39469F;
    --surface:#ECEFF4;
    --surface-2:#E2E7EE;
    --card:#FFFFFF;
    --line:#D6DCE5;
    --line-soft:#E7EBF1;
    --muted:#647084;
    --text:#1B2734;
    --danger:#b0413a;
    --ok:#2f6f4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--surface);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }

  /* ============ APP LAYOUT ============ */
  .app{
    display:grid;
    grid-template-columns: minmax(360px, 460px) 1fr;
    min-height:100vh;
  }
  .panel{
    background:var(--card);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    max-height:100vh;
    overflow:hidden;
  }
  .panel-head{
    padding:20px 24px 18px;
    border-bottom:1px solid var(--line);
    background:var(--ink);
    color:#fff;
    display:flex;
    align-items:center;
    gap:13px;
  }
  .mark{height:40px;width:auto;flex:none;}
  .brand-text .name{
    font-family:"IBM Plex Serif",serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:.2px;
    line-height:1.1;
  }
  .brand-text .sub{
    font-size:11.5px;
    color:#b6c2d4;
    letter-spacing:.3px;
    margin-top:2px;
  }
  .panel-body{
    padding:22px 24px 120px;
    overflow-y:auto;
  }

  .group{margin-bottom:26px;}
  .group-title{
    display:flex;align-items:center;gap:8px;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color:var(--accent-deep);
    margin:0 0 14px;
  }
  .group-title::after{
    content:"";flex:1;height:1px;background:var(--line);
  }

  .field{margin-bottom:13px;}
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:5px;
    letter-spacing:.2px;
  }
  .field .hint{font-weight:400;color:#9aa4b4;text-transform:none;letter-spacing:0;}
  input, textarea, select{
    width:100%;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    transition:border-color .15s, box-shadow .15s;
  }
  input.mono{font-family:"IBM Plex Mono",monospace;}
  textarea{resize:vertical;min-height:58px;}
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(20,35,58,.10);
  }
  .row{display:flex;gap:11px;}
  .row > .field{flex:1;margin-bottom:13px;}

  /* line items editor */
  .items-head, .item-row{
    display:grid;
    grid-template-columns: 1fr 78px 52px 96px 26px;
    gap:8px;
    align-items:center;
  }
  .items-head{
    font-size:10.5px;font-weight:600;letter-spacing:.4px;
    color:var(--muted);text-transform:uppercase;margin-bottom:7px;padding:0 2px;
  }
  .item-row{margin-bottom:8px;}
  .item-row input{padding:8px 9px;font-size:13px;}
  .item-del{
    border:none;background:none;color:#b7bfca;cursor:pointer;
    font-size:18px;line-height:1;padding:4px;border-radius:6px;
  }
  .item-del:hover{color:var(--danger);background:#f7eceb;}
  .add-item{
    margin-top:4px;
    background:#fff;border:1px dashed var(--line);color:var(--ink-2);
    font-weight:600;font-size:12.5px;border-radius:8px;padding:9px;
    width:100%;cursor:pointer;transition:.15s;
  }
  .add-item:hover{border-color:var(--ink);background:#f7f9fb;}

  .pill-toggle{display:flex;gap:8px;}
  .pill-toggle label{flex:1;margin:0;}
  .pill-toggle input{position:absolute;opacity:0;pointer-events:none;}
  .pill{
    display:block;text-align:center;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;padding:9px 6px;
    font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;transition:.15s;
  }
  .pill small{display:block;font-weight:400;font-size:10.5px;margin-top:2px;color:#9aa4b4;}
  .pill-toggle input:checked + .pill{
    border-color:var(--ink);background:var(--ink);color:#fff;
  }
  .pill-toggle input:checked + .pill small{color:#c6d0dd;}

  details.adv{border-top:1px solid var(--line);padding-top:14px;}
  details.adv > summary{
    cursor:pointer;font-size:11px;font-weight:600;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--accent-deep);list-style:none;
    display:flex;align-items:center;gap:8px;margin-bottom:0;
  }
  details.adv > summary::-webkit-details-marker{display:none;}
  details.adv > summary .chev{transition:transform .2s;font-size:13px;color:var(--muted);}
  details.adv[open] > summary .chev{transform:rotate(90deg);}
  details.adv[open] > summary{margin-bottom:16px;}

  /* ============ PREVIEW SIDE ============ */
  .preview-wrap{
    overflow-y:auto;
    max-height:100vh;
    padding:34px 24px 140px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .sheet-holder{transform-origin:top center;}
  .toolbar{
    position:fixed;
    bottom:0;left:460px;right:0;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:14px 24px;
    display:flex;gap:12px;align-items:center;justify-content:flex-end;
    z-index:20;
  }
  .total-chip{
    margin-right:auto;
    font-size:13px;color:var(--muted);
  }
  .total-chip b{
    font-family:"IBM Plex Mono",monospace;
    color:var(--ink);font-size:17px;margin-left:6px;
  }
  .btn{
    font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;
    border-radius:9px;padding:11px 18px;border:1px solid transparent;transition:.15s;
  }
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-primary{
    background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(197,132,28,.35);
  }
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-primary:disabled{opacity:.6;cursor:wait;}

  /* ============ THE INVOICE SHEET ============ */
  .sheet{
    width:794px;
    min-height:1123px;
    background:#fff;
    color:#1a2430;
    box-shadow:0 8px 40px rgba(20,35,58,.16);
    padding:46px 48px 40px;
    display:flex;flex-direction:column;
    font-size:12.5px;
  }
  .inv-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;}
  .inv-brand{display:flex;gap:14px;align-items:flex-start;max-width:58%;}
  .inv-logo{width:54px;height:54px;flex:none;border-radius:8px;object-fit:contain;}
  .inv-logo-lockup{max-height:52px;max-width:330px;width:auto;height:auto;display:block;margin-bottom:6px;}
  .inv-brand--logo{flex-direction:column;align-items:flex-start;gap:0;max-width:64%;}
  .inv-co-name{
    font-family:"IBM Plex Serif",serif;font-weight:600;font-size:23px;color:var(--ink);line-height:1.05;
  }
  .inv-co-tag{font-size:11.5px;color:var(--accent-deep);font-weight:600;letter-spacing:.4px;margin-top:3px;}
  .inv-co-meta{font-size:11px;color:#54627a;margin-top:8px;line-height:1.55;white-space:pre-line;}
  .inv-co-meta b{color:#2b3a4f;font-weight:600;}

  .inv-title-block{text-align:right;min-width:230px;}
  .inv-title{
    font-family:"IBM Plex Serif",serif;font-weight:600;font-size:22px;
    letter-spacing:3px;color:var(--ink);text-transform:uppercase;
  }
  .inv-title-rule{height:3px;width:64px;background:var(--accent);margin:8px 0 12px auto;border-radius:2px;}
  .inv-meta{font-size:11.5px;width:100%;}
  .inv-meta div{display:flex;justify-content:space-between;gap:18px;padding:3px 0;}
  .inv-meta .k{color:#647084;}
  .inv-meta .v{font-family:"IBM Plex Mono",monospace;font-weight:500;color:#1f2c3c;text-align:right;}

  .inv-divider{height:1px;background:var(--line);margin:22px 0;}

  .inv-parties{display:flex;gap:20px;margin-bottom:22px;}
  .party{flex:1;}
  .party .plabel{
    font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--accent-deep);margin-bottom:7px;
  }
  .party .pname{font-size:14.5px;font-weight:600;color:#1c2734;}
  .party .pmeta{font-size:11.5px;color:#54627a;margin-top:5px;line-height:1.6;white-space:pre-line;}
  .party .pmeta b{color:#2b3a4f;font-weight:600;}

  table.inv-items{width:100%;border-collapse:collapse;margin-bottom:0;}
  table.inv-items thead th{
    background:var(--ink);color:#fff;font-weight:600;font-size:10.5px;
    letter-spacing:.5px;text-transform:uppercase;padding:10px 10px;text-align:left;
  }
  table.inv-items thead th.num{text-align:right;}
  table.inv-items thead th:first-child{border-radius:6px 0 0 0;}
  table.inv-items thead th:last-child{border-radius:0 6px 0 0;}
  table.inv-items tbody td{
    padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px;
  }
  table.inv-items tbody td.num{text-align:right;font-family:"IBM Plex Mono",monospace;}
  table.inv-items tbody td.idx{color:#8b96a5;font-family:"IBM Plex Mono",monospace;}
  table.inv-items .desc-main{font-weight:600;color:#1f2c3c;}
  table.inv-items .sac{font-family:"IBM Plex Mono",monospace;color:#5b6a80;}

  .inv-bottom{display:flex;gap:28px;margin-top:22px;}
  .inv-left{flex:1.25;}
  .words-box{
    background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:16px;
  }
  .words-box .wl{font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent-deep);}
  .words-box .wv{font-size:12.5px;font-weight:600;color:#1f2c3c;margin-top:3px;line-height:1.45;}
  .small-block{margin-bottom:14px;}
  .small-block .sl{font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#8b96a5;margin-bottom:5px;}
  .small-block .sv{font-size:11.5px;color:#46546a;line-height:1.7;white-space:pre-line;}
  .small-block .sv b{color:#2b3a4f;font-weight:600;}
  .bank-grid{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:11.5px;}
  .bank-grid .bk{color:#7a8698;}
  .bank-grid .bv{font-family:"IBM Plex Mono",monospace;color:#2b3a4f;font-weight:500;}

  .inv-totals{flex:1;align-self:flex-start;}
  .tot-row{display:flex;justify-content:space-between;gap:16px;padding:7px 4px;font-size:12.5px;border-bottom:1px solid var(--line-soft);}
  .tot-row .tk{color:#566377;}
  .tot-row .tv{font-family:"IBM Plex Mono",monospace;color:#1f2c3c;font-weight:500;}
  .tot-row.muted .tk,.tot-row.muted .tv{color:#8b96a5;font-weight:400;}
  .grand{
    margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:16px;
    background:var(--ink);color:#fff;border-left:5px solid var(--accent);
    border-radius:8px;padding:14px 16px;
  }
  .grand .gk{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#c6d0dd;}
  .grand .gv{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;}

  .inv-foot{
    margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  }
  .terms{flex:1;font-size:10.5px;color:#7a8698;line-height:1.7;}
  .terms b{color:#46546a;}
  .sign{text-align:center;min-width:200px;}
  .sign .sfor{font-size:11.5px;color:#566377;margin-bottom:46px;}
  .sign .sfor b{color:#1f2c3c;font-family:"IBM Plex Serif",serif;}
  .sign .sline{border-top:1px solid #9aa6b6;padding-top:6px;font-size:10.5px;color:#7a8698;}

  /* ============ RESPONSIVE ============ */
  @media (max-width: 980px){
    .app{grid-template-columns:1fr;}
    .panel{max-height:none;border-right:none;border-bottom:1px solid var(--line);}
    .panel-body{max-height:none;padding-bottom:32px;}
    .preview-wrap{max-height:none;padding:24px 14px 150px;}
    .toolbar{left:0;}
  }
</style>
</head>

      <div class="brand-text">
        <div class="name">Trinetra Systems</div>
        <div class="sub">GST Invoice Generator</div>
      </div>
    </div>

    <div class="panel-body">

      <!-- CLIENT -->
      <div class="group">
        <h3 class="group-title">Bill to (client)</h3>
        <div class="field">
          <label>Client name</label>
          <input id="clientName" type="text" placeholder="e.g. Acme Pvt. Ltd." value="" />
        </div>
        <div class="field">
          <label>Client address <span class="hint">(optional)</span></label>
          <textarea id="clientAddress" placeholder="Street, City, State – PIN"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label>Client GSTIN <span class="hint">(optional)</span></label>
            <input id="clientGstin" class="mono" type="text" placeholder="—" />
          </div>
          <div class="field">
            <label>Place of supply</label>
            <input id="placeOfSupply" type="text" placeholder="State name" />
          </div>
        </div>
      </div>

      <!-- ITEMS -->
      <div class="group">
        <h3 class="group-title">Items &amp; charges</h3>
        <div class="items-head">
          <span>Description</span><span>SAC/HSN</span><span>Qty</span><span style="text-align:right">Rate ₹</span><span></span>
        </div>
        <div id="itemsContainer"></div>
        <button class="add-item" id="addItemBtn" type="button">+ Add another item</button>
        <p style="font-size:11px;color:#9aa4b4;margin:10px 2px 0;">Enter the rate <b>before GST</b>. Tax is added automatically below.</p>
      </div>

      <!-- TAX -->
      <div class="group">
        <h3 class="group-title">Tax</h3>
        <div class="field">
          <label>GST type</label>
          <div class="pill-toggle">
            <label>
              <input type="radio" name="gstType" value="intra" checked />
              <span class="pill">CGST + SGST <small>Same state</small></span>
            </label>
            <label>
              <input type="radio" name="gstType" value="inter" />
              <span class="pill">IGST <small>Other state</small></span>
            </label>
          </div>
        </div>
        <div class="field">
          <label>GST rate</label>
          <select id="gstRate">
            <option value="18" selected>18%</option>
            <option value="12">12%</option>
            <option value="28">28%</option>
            <option value="5">5%</option>
            <option value="0">0% / Exempt</option>
          </select>
        </div>
      </div>

      <!-- INVOICE DETAILS -->
      <div class="group">
        <h3 class="group-title">Invoice details</h3>
        <div class="row">
          <div class="field">
            <label>Invoice no.</label>
            <input id="invoiceNo" class="mono" type="text" />
          </div>
          <div class="field">
            <label>Invoice date</label>
            <input id="invoiceDate" type="date" />
          </div>
        </div>
        <div class="field">
          <label>Due date <span class="hint">(optional)</span></label>
          <input id="dueDate" type="date" />
        </div>
        <div class="field">
          <label>Notes / terms <span class="hint">(optional)</span></label>
          <textarea id="notes" placeholder="e.g. Payment due within 15 days.">Payment due within 15 days of invoice date.</textarea>
        </div>
      </div>

      <!-- COMPANY (collapsible) -->
      <details class="adv">
        <summary><span class="chev">▶</span> Your business &amp; bank details</summary>
        <div class="field">
          <label>Business name</label>
          <input id="coName" type="text" value="Trinetra Systems" />
        </div>
        <div class="field">
          <label>Tagline</label>
          <input id="coTag" type="text" value="IT Solutions &amp; Services" />
        </div>
        <div class="field">
          <label>Address</label>
          <textarea id="coAddress">123, Tech Park Road,
City, State – 000000</textarea>
        </div>
        <div class="row">
          <div class="field">
            <label>GSTIN</label>
            <input id="coGstin" class="mono" type="text" value="22AAAAA0000A1Z5" />
          </div>
          <div class="field">
            <label>State</label>
            <input id="coState" type="text" value="State Name" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Email</label>
            <input id="coEmail" type="text" value="info@trinetrasystems.in" />
          </div>
          <div class="field">
            <label>Phone</label>
            <input id="coPhone" type="text" value="+91 00000 00000" />
          </div>
        </div>
        <div class="field">
          <label>Logo <span class="hint">(optional — replaces the default mark)</span></label>
          <input id="logoUpload" type="file" accept="image/*" />
        </div>

        <div class="group-title" style="margin-top:18px;">Bank</div>
        <div class="row">
          <div class="field">
            <label>Account holder</label>
            <input id="bankHolder" type="text" value="Trinetra Systems" />
          </div>
          <div class="field">
            <label>Bank name</label>
            <input id="bankName" type="text" value="Bank Name" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Account no.</label>
            <input id="bankAcc" class="mono" type="text" value="0000000000000" />
          </div>
          <div class="field">
            <label>IFSC</label>
            <input id="bankIfsc" class="mono" type="text" value="BANK0000000" />
          </div>
        </div>
        <div class="field">
          <label>Signatory label</label>
          <input id="signatory" type="text" value="Authorised Signatory" />
        </div>
      </details>

    </div>
  </section>

  <!-- ============ PREVIEW PANEL ============ -->
  <section class="preview-wrap">
    <div class="sheet-holder" id="sheetHolder">
      <div class="sheet" id="invoiceSheet"><!-- rendered by JS --></div>
    </div>
  </section>

  <!-- ACTION BAR -->
  <div class="toolbar">
    <div class="total-chip">Grand total <b id="chipTotal">₹0.00</b></div>
    <button class="btn btn-ghost" id="printBtn" type="button">Print</button>
    <button class="btn btn-primary" id="pdfBtn" type="button">Download invoice PDF</button>
  </div>

</div>

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatINR(n){
  const num = isFinite(n) ? Number(n) : 0;
  const neg = num < 0;
  const [intPart, decPart] = Math.abs(num).toFixed(2).split('.');
  let last3 = intPart.slice(-3);
  let other = intPart.slice(0, -3);
  if (other) last3 = ',' + last3;
  const grouped = other.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
  return (neg ? '-' : '') + '₹' + grouped + '.' + decPart;
}

function numberToWords(num){
  num = Math.floor(Math.abs(num));
  if (num === 0) return 'Zero';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){
    if (n < 20) return a[n];
    return b[Math.floor(n/10)] + (n%10 ? ' ' + a[n%10] : '');
  }
  function three(n){
    return (Math.floor(n/100) ? a[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' : '') : '') + (n%100 ? two(n%100) : '');
  }
  let res = '';
  const crore = Math.floor(num / 10000000); num %= 10000000;
  const lakh  = Math.floor(num / 100000);   num %= 100000;
  const thou  = Math.floor(num / 1000);      num %= 1000;
  const hund  = num;
  if (crore) res += three(crore) + ' Crore ';
  if (lakh)  res += two(lakh) + ' Lakh ';
  if (thou)  res += two(thou) + ' Thousand ';
  if (hund)  res += three(hund);
  return res.trim().replace(/\s+/g,' ');
}

function fmtDate(v){
  if(!v) return '—';
  const d = new Date(v + 'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

/* ---------- line items ---------- */
function addItemRow(desc, sac, qty, rate){
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML =
    '<input class="it-desc" type="text" placeholder="Service / product" value="'+esc(desc||'')+'">' +
    '<input class="it-sac mono" type="text" placeholder="998314" value="'+esc(sac||'')+'">' +
    '<input class="it-qty" type="number" min="0" step="1" value="'+(qty!=null?qty:1)+'">' +
    '<input class="it-rate mono" type="number" min="0" step="0.01" placeholder="0.00" value="'+(rate!=null?rate:'')+'">' +
    '<button class="item-del" type="button" title="Remove">&times;</button>';
  row.querySelector('.item-del').addEventListener('click', ()=>{
    if ($('itemsContainer').children.length > 1){ row.remove(); render(); }
  });
  row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', render));
  $('itemsContainer').appendChild(row);
}

function readItems(){
  const rows = [...$('itemsContainer').querySelectorAll('.item-row')];
  return rows.map(r => ({
    desc: r.querySelector('.it-desc').value.trim(),
    sac:  r.querySelector('.it-sac').value.trim(),
    qty:  parseFloat(r.querySelector('.it-qty').value) || 0,
    rate: parseFloat(r.querySelector('.it-rate').value) || 0
  }));
}

/* ---------- totals ---------- */
function computeTotals(items, gstRate, intra){
  const taxable = items.reduce((s,i)=> s + i.qty * i.rate, 0);
  const tax = taxable * gstRate / 100;
  let cgst=0, sgst=0, igst=0;
  if (intra){ cgst = tax/2; sgst = tax/2; } else { igst = tax; }
  const raw = taxable + tax;
  const grand = Math.round(raw);
  const roundOff = grand - raw;
  return { taxable, cgst, sgst, igst, tax, raw, grand, roundOff };
}

/* ---------- render the invoice ---------- */
function render(){
  const intra = document.querySelector('input[name="gstType"]:checked').value === 'intra';
  const gstRate = parseFloat($('gstRate').value) || 0;
  const items = readItems();
  const t = computeTotals(items, gstRate, intra);

  const co = {
    name: $('coName').value || 'Trinetra Systems',
    tag: $('coTag').value,
    address: $('coAddress').value,
    gstin: $('coGstin').value,
    state: $('coState').value,
    email: $('coEmail').value,
    phone: $('coPhone').value
  };

  const clientName = $('clientName').value.trim() || 'Client name';
  const half = (gstRate/2);

  const markSvg = '<svg class="inv-logo" viewBox="0 0 48 48"><path d="M24 6 L42 38 H6 Z" fill="none" stroke="#181D42" stroke-width="2.6" stroke-linejoin="round"/><circle cx="24" cy="28" r="5" fill="#fff"/><circle cx="24" cy="28" r="2.2" fill="#5062DE"/><path d="M16 28 Q24 20 32 28" fill="none" stroke="#181D42" stroke-width="2" stroke-linecap="round"/></svg>';
  const tagHtml = co.tag ? '<div class="inv-co-tag">'+esc(co.tag)+'</div>' : '';
  const metaHtml = '<div class="inv-co-meta">' +
      (co.address ? esc(co.address)+'\n' : '') +
      (co.gstin ? '<b>GSTIN:</b> '+esc(co.gstin)+'   ' : '') +
      (co.state ? '<b>State:</b> '+esc(co.state) : '') +
      ((co.email||co.phone) ? '\n' + esc(co.email) + (co.email&&co.phone?'  ·  ':'') + esc(co.phone) : '') +
    '</div>';
  let brandHtml;
  if (logoDataUrl){
    brandHtml = '<div class="inv-brand inv-brand--logo">' +
      '<img class="inv-logo-lockup" src="'+logoDataUrl+'" alt="'+esc(co.name)+' logo">' +
      tagHtml + metaHtml + '</div>';
  } else {
    brandHtml = '<div class="inv-brand">' + markSvg +
      '<div><div class="inv-co-name">'+esc(co.name)+'</div>' + tagHtml + metaHtml + '</div></div>';
  }

  // item rows
  let rowsHtml = '';
  items.forEach((it, idx)=>{
    const amt = it.qty * it.rate;
    rowsHtml +=
      '<tr>' +
        '<td class="idx">'+(idx+1)+'</td>' +
        '<td><div class="desc-main">'+esc(it.desc||'Service')+'</div></td>' +
        '<td class="sac">'+esc(it.sac||'—')+'</td>' +
        '<td class="num">'+(it.qty||0)+'</td>' +
        '<td class="num">'+formatINR(it.rate)+'</td>' +
        '<td class="num">'+formatINR(amt)+'</td>' +
      '</tr>';
  });

  // tax rows depending on type
  let taxRows = '';
  if (gstRate === 0){
    taxRows = '<div class="tot-row"><span class="tk">GST</span><span class="tv">Exempt</span></div>';
  } else if (intra){
    taxRows =
      '<div class="tot-row"><span class="tk">CGST @ '+half+'%</span><span class="tv">'+formatINR(t.cgst)+'</span></div>' +
      '<div class="tot-row"><span class="tk">SGST @ '+half+'%</span><span class="tv">'+formatINR(t.sgst)+'</span></div>';
  } else {
    taxRows = '<div class="tot-row"><span class="tk">IGST @ '+gstRate+'%</span><span class="tv">'+formatINR(t.igst)+'</span></div>';
  }
  let roundRow = '';
  if (Math.abs(t.roundOff) >= 0.005){
    roundRow = '<div class="tot-row muted"><span class="tk">Rounding</span><span class="tv">'+formatINR(t.roundOff)+'</span></div>';
  }

  // client meta lines
  let clientMeta = '';
  const cAddr = $('clientAddress').value.trim();
  const cGst = $('clientGstin').value.trim();
  if (cAddr) clientMeta += esc(cAddr) + '\n';
  if (cGst)  clientMeta += 'GSTIN: ' + esc(cGst);

  const sheet = $('invoiceSheet');
  sheet.innerHTML =
    '<div class="inv-top">' +
      brandHtml +
      '<div class="inv-title-block">' +
        '<div class="inv-title">Tax Invoice</div>' +
        '<div class="inv-title-rule"></div>' +
        '<div class="inv-meta">' +
          '<div><span class="k">Invoice No.</span><span class="v">'+esc($('invoiceNo').value||'—')+'</span></div>' +
          '<div><span class="k">Date</span><span class="v">'+fmtDate($('invoiceDate').value)+'</span></div>' +
          ($('dueDate').value ? '<div><span class="k">Due Date</span><span class="v">'+fmtDate($('dueDate').value)+'</span></div>' : '') +
          '<div><span class="k">Reverse Charge</span><span class="v">No</span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="inv-divider"></div>' +

    '<div class="inv-parties">' +
      '<div class="party">' +
        '<div class="plabel">Bill To</div>' +
        '<div class="pname">'+esc(clientName)+'</div>' +
        (clientMeta ? '<div class="pmeta">'+clientMeta.replace(/GSTIN:/,'<b>GSTIN:</b>')+'</div>' : '') +
      '</div>' +
      '<div class="party">' +
        '<div class="plabel">Place of Supply</div>' +
        '<div class="pname" style="font-size:13px;font-weight:600;">'+esc($('placeOfSupply').value || co.state || '—')+'</div>' +
        '<div class="pmeta">Supply type: '+(intra?'Intra-state':'Inter-state')+'</div>' +
      '</div>' +
    '</div>' +

    '<table class="inv-items">' +
      '<thead><tr>' +
        '<th style="width:34px;">#</th>' +
        '<th>Description</th>' +
        '<th style="width:90px;">SAC/HSN</th>' +
        '<th class="num" style="width:50px;">Qty</th>' +
        '<th class="num" style="width:110px;">Rate</th>' +
        '<th class="num" style="width:120px;">Amount</th>' +
      '</tr></thead>' +
      '<tbody>'+rowsHtml+'</tbody>' +
    '</table>' +

    '<div class="inv-bottom">' +
      '<div class="inv-left">' +
        '<div class="words-box">' +
          '<div class="wl">Amount in words</div>' +
          '<div class="wv">Rupees '+numberToWords(t.grand)+' Only</div>' +
        '</div>' +
        '<div class="small-block">' +
          '<div class="sl">Bank details</div>' +
          '<div class="bank-grid">' +
            '<span class="bk">A/c Name</span><span class="bv">'+esc($('bankHolder').value)+'</span>' +
            '<span class="bk">A/c No.</span><span class="bv">'+esc($('bankAcc').value)+'</span>' +
            '<span class="bk">IFSC</span><span class="bv">'+esc($('bankIfsc').value)+'</span>' +
            '<span class="bk">Bank</span><span class="bv">'+esc($('bankName').value)+'</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="inv-totals">' +
        '<div class="tot-row"><span class="tk">Taxable value</span><span class="tv">'+formatINR(t.taxable)+'</span></div>' +
        taxRows +
        roundRow +
        '<div class="grand"><span class="gk">Grand Total</span><span class="gv">'+formatINR(t.grand)+'</span></div>' +
      '</div>' +
    '</div>' +

    '<div class="inv-foot">' +
      '<div class="terms">' +
        ($('notes').value ? '<b>Terms:</b> '+esc($('notes').value)+'<br><br>' : '') +
        'This is a computer-generated invoice and does not require a physical signature unless stated.' +
      '</div>' +
      '<div class="sign">' +
        '<div class="sfor">For <b>'+esc(co.name)+'</b></div>' +
        '<div class="sline">'+esc($('signatory').value||'Authorised Signatory')+'</div>' +
      '</div>' +
    '</div>';

  $('chipTotal').textContent = formatINR(t.grand);
}

/* ---------- preview scaling ---------- */
function scalePreview(){
  const wrap = document.querySelector('.preview-wrap');
  const holder = $('sheetHolder');
  const avail = wrap.clientWidth - 48;
  const scale = Math.min(1, avail / 794);
  holder.style.transform = 'scale(' + scale + ')';
  holder.style.height = (1123 * scale) + 'px';
  holder.style.marginBottom = (-(1123 * (1-scale))) + 'px';
}

/* ---------- PDF export (clone at full size, then capture) ---------- */
async function downloadPDF(){
  const btn = $('pdfBtn');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generating…';
  try{
    await document.fonts.ready;
    const sheet = $('invoiceSheet');
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-100000px;top:0;background:#fff;';
    const clone = sheet.cloneNode(true);
    clone.style.transform = 'none';
    clone.style.boxShadow = 'none';
    holder.appendChild(clone);
    document.body.appendChild(holder);

    const canvas = await html2canvas(clone, {
      scale: 3, backgroundColor:'#ffffff', useCORS:true,
      windowWidth: clone.offsetWidth, windowHeight: clone.offsetHeight
    });
    document.body.removeChild(holder);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pw = 210, ph = 297;
    const imgW = pw;
    const imgH = canvas.height * imgW / canvas.width;
    const imgData = canvas.toDataURL('image/png');

    let heightLeft = imgH, position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH, '', 'FAST');
    heightLeft -= ph;
    while (heightLeft > 0){
      position -= ph;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH, '', 'FAST');
      heightLeft -= ph;
    }

    const safe = ($('clientName').value.trim() || 'Client').replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_');
    const inv = ($('invoiceNo').value || '').replace(/[^\w\-]+/g,'_');
    pdf.save('Invoice_'+safe+(inv?'_'+inv:'')+'.pdf');
  } catch(e){
    alert('Sorry — the PDF could not be generated. Please try again.\n\n'+e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

/* ---------- defaults & wiring ---------- */
function financialYear(d){
  const y = d.getFullYear();
  const startYear = d.getMonth() >= 3 ? y : y - 1; // FY starts April
  const a = String(startYear).slice(-2);
  const b = String(startYear + 1).slice(-2);
  return a + '-' + b;
}

function init(){
  const today = new Date();
  $('invoiceDate').value = today.toISOString().slice(0,10);
  $('invoiceNo').value = 'TS/' + financialYear(today) + '/001';

  addItemRow('Software development services', '998314', 1, '');

  // re-render on every input across the form
  document.querySelectorAll('input, textarea, select').forEach(el=>{
    if (el.id === 'logoUpload') return;
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  $('addItemBtn').addEventListener('click', ()=>{ addItemRow('', '998314', 1, ''); render(); });

  $('logoUpload').addEventListener('change', e=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => { logoDataUrl = ev.target.result; render(); };
    reader.readAsDataURL(f);
  });

  $('pdfBtn').addEventListener('click', downloadPDF);
  $('printBtn').addEventListener('click', ()=> window.print());

  window.addEventListener('resize', scalePreview);

  render();
  scalePreview();
}

document.addEventListener('DOMContentLoaded', init);
</script>
